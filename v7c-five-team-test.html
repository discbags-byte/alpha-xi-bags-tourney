<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alpha Xi Bags Tourney - 5 Team Test</title><style>:root{--bg:#0b1020;--panel:#151c2f;--line:#2a3856;--text:#f8fafc;--muted:#9aa8bd;--blue:#0051BA;--red:#E8000D;--amber:#f59e0b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#080d19,#0b1020);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:14px 12px 50px}.wrap{max-width:900px;margin:auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}h1{font-size:22px;margin:0 0 4px}h2{font-size:19px;margin:0 0 10px}.muted{color:var(--muted);font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.pill{font-size:12px;font-weight:900;background:#23314c;padding:6px 9px;border-radius:999px}.boards{display:grid;gap:10px}.game{border:1px solid #3c4e70;border-radius:14px;padding:12px;background:#10192c}.game.live{border-color:var(--blue)}.label{font-size:12px;font-weight:1000;color:#93c5fd;text-transform:uppercase}.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.pick{border:0;border-radius:12px;min-height:48px;padding:10px;color:white;font-weight:900}.pick.red{background:var(--red)}.pick.blue{background:var(--blue)}.scroll{overflow-x:auto}.grid{display:flex;gap:12px;min-width:max-content;align-items:flex-start}.col{width:220px;flex:0 0 220px}.ct{font-size:12px;font-weight:1000;color:#93c5fd;text-transform:uppercase;margin-bottom:7px}.match{background:#10192c;border:1px solid #304262;border-radius:12px;padding:8px;margin-bottom:10px}.match.active{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}.match.done{opacity:.6}.slot{padding:8px;background:#17233a;border-radius:8px;margin-top:5px}.status{font-size:11px;color:var(--muted);margin-top:7px}.next{border-left:4px solid var(--blue)}.waiting{border-left:4px solid var(--amber)}.reset{border:0;background:#263653;color:white;border-radius:10px;padding:10px 12px;font-weight:900}</style></head><body><div class="wrap"><div class="card"><div class="row"><div><h1>5-Team Bracket Sandbox</h1><div class="muted">Does not touch your real tournament data.</div></div><button class="reset" id="reset">Reset Test</button></div></div><div id="live"></div><div id="bracket"></div></div><script>const TEAMS=[{id:'t1',seed:1,name:'Claude / McCracken'},{id:'t2',seed:2,name:'Beggs / Hooker'},{id:'t3',seed:3,name:'Wilkinson / Bagby'},{id:'t4',seed:4,name:'Patton / Shaw'},{id:'t5',seed:5,name:'Gordo / Abendroth'}];let matches=[];let seq=0;const byId=id=>TEAMS.find(t=>t.id===id);function nm(br,round,a,b){return{id:'m'+(++seq),br,round,a,b,teamA:null,teamB:null,status:'waiting',winner:null,loser:null,board:null}}function srcSeed(seed){return{kind:'seed',seed}}function srcWin(id){return{kind:'winner',id}}function srcLose(id){return{kind:'loser',id}}function seedOrder(size){let a=[1,2];while(a.length<size){const n=a.length*2,o=[];for(const x of a)o.push(x,n+1-x);a=o}return a}function build(){seq=0;matches=[];const order=seedOrder(8),wb1=[];for(let i=0;i<8;i+=2){const m=nm('WB',1,srcSeed(order[i]),srcSeed(order[i+1]));matches.push(m);wb1.push(m.id)}let prev=wb1;for(let r=2;r<=3;r++){const ids=[];for(let i=0;i<prev.length;i+=2){const m=nm('WB',r,srcWin(prev[i]),srcWin(prev[i+1]));matches.push(m);ids.push(m.id)}prev=ids}let lbPrev=[];for(let i=0;i<wb1.length;i+=2){const m=nm('LB',1,srcLose(wb1[i]),srcLose(wb1[i+1]));matches.push(m);lbPrev.push(m.id)}let lr=1;for(let wr=2;wr<=3;wr++){const wbIds=matches.filter(m=>m.br==='WB'&&m.round===wr).map(m=>m.id);lr++;const major=[];const drop=[...wbIds].reverse();for(let i=0;i<drop.length;i++){const m=nm('LB',lr,srcWin(lbPrev[i]),srcLose(drop[i]));matches.push(m);major.push(m.id)}lbPrev=major;if(wr<3){lr++;const minor=[];for(let i=0;i<lbPrev.length;i+=2){const m=nm('LB',lr,srcWin(lbPrev[i]),srcWin(lbPrev[i+1]));matches.push(m);minor.push(m.id)}lbPrev=minor}}const wbf=matches.filter(m=>m.br==='WB'&&m.round===3)[0].id,lbf=lbPrev[0];matches.push(nm('GF',1,srcWin(wbf),srcWin(lbf)));resolve();schedule();render()}function sval(s){if(s.kind==='seed'){const t=TEAMS.find(x=>x.seed===s.seed);return{known:true,id:t?.id||null}}const m=matches.find(x=>x.id===s.id);if(!m||m.status!=='done')return{known:false,id:null};return{known:true,id:s.kind==='winner'?m.winner:m.loser}}function resolve(){let ch=true;while(ch){ch=false;for(const m of matches.filter(x=>x.status==='waiting')){const a=sval(m.a),b=sval(m.b);if(!a.known||!b.known)continue;m.teamA=a.id;m.teamB=b.id;if(m.teamA&&m.teamB)m.status='queued';else{m.status='done';m.winner=m.teamA||m.teamB||null;m.loser=null}ch=true}}}function schedule(){for(const m of matches)m.board=null;const ready=matches.filter(m=>m.status==='queued');for(let i=0;i<Math.min(2,ready.length);i++){ready[i].status='active';ready[i].board=i+1}}function win(id,tid){const m=matches.find(x=>x.id===id);if(m.status!=='active')return;m.winner=tid;m.loser=m.teamA===tid?m.teamB:m.teamA;m.status='done';m.board=null;resolve();schedule();render()}function ref(s){if(s.kind==='seed'){const t=TEAMS.find(x=>x.seed===s.seed);return t?t.name:`Seed #${s.seed}`}const m=matches.find(x=>x.id===s.id);if(!m)return'TBD';if(m.status==='done'){const id=s.kind==='winner'?m.winner:m.loser;return byId(id)?.name||'TBD'}const w=s.kind==='winner'?'Winner':'Loser';if(m.status==='active')return`${w} of Board ${m.board}`;return`${w} of ${m.br} Round ${m.round}`}function mh(m){const a=byId(m.teamA)?.name||ref(m.a),b=byId(m.teamB)?.name||ref(m.b);const cls=m.status==='active'?' active':m.status==='done'?' done':'';const st=m.teamA||m.teamB?(m.status==='active'?`Playing on Board ${m.board}`:m.status==='queued'?'Ready to play':m.status==='done'?(m.loser===null?'Bye / auto-advance':`Winner: ${byId(m.winner)?.name}`):'Waiting'):'Empty bracket slot';return`<div class="match${cls}"><div class="slot">${a}</div><div class="slot">${b}</div><div class="status">${st}</div></div>`}function col(title,arr){return`<div class="col"><div class="ct">${title}</div>${arr.map(mh).join('')}</div>`}function render(){const active=matches.filter(m=>m.status==='active');document.getElementById('live').innerHTML=`<div class="card"><div class="row"><h2>Games Playing Now</h2><span class="pill">2 boards</span></div><div class="boards">${active.length?active.map(m=>`<div class="game live"><div class="label">Board ${m.board} • ${m.br} ${m.round}</div><div class="teams"><button class="pick red" data-mid="${m.id}" data-tid="${m.teamA}">${byId(m.teamA).name} WIN</button><button class="pick blue" data-mid="${m.id}" data-tid="${m.teamB}">${byId(m.teamB).name} WIN</button></div></div>`).join(''):'<div class="muted">No active games.</div>'}</div></div>`;document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>win(b.dataset.mid,b.dataset.tid));const wb=matches.filter(m=>m.br==='WB'),lb=matches.filter(m=>m.br==='LB'),gf=matches.filter(m=>m.br==='GF');const wr=[1,2,3],lr=[...new Set(lb.map(m=>m.round))];const queued=matches.filter(m=>m.status==='queued'),waiting=matches.filter(m=>m.status==='waiting');document.getElementById('bracket').innerHTML=`<div class="card"><h2>Winners Bracket</h2><div class="scroll"><div class="grid">${wr.map(r=>col('WB Round '+r,wb.filter(m=>m.round===r))).join('')}</div></div></div><div class="card"><h2>Losers Bracket</h2><div class="scroll"><div class="grid">${lr.map(r=>col('LB Round '+r,lb.filter(m=>m.round===r))).join('')}</div></div></div><div class="card"><h2>Championship</h2>${gf.map(mh).join('')}</div><div class="card"><div class="row"><h2>Next Up</h2><span class="pill">${queued.length} ready • ${waiting.length} waiting</span></div>${queued.slice(0,4).map(m=>`<div class="match next"><div class="status">READY WHEN A BOARD OPENS</div><strong>${byId(m.teamA)?.name||ref(m.a)}</strong><div class="muted">vs ${byId(m.teamB)?.name||ref(m.b)}</div></div>`).join('')}${waiting.slice(0,6).map(m=>`<div class="match waiting"><div class="status">WAITING ON RESULT</div><strong>${byId(m.teamA)?.name||ref(m.a)}</strong><div class="muted">vs ${byId(m.teamB)?.name||ref(m.b)}</div></div>`).join('')}</div>`}document.getElementById('reset').onclick=build;build();</script></body></html>
