<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alpha Xi Bags Tourney V7 Test</title><body style="font-family:-apple-system;background:#111827;color:white;padding:20px">Loading V7 test…<script>fetch('index.html?cb='+Date.now()).then(r=>r.text()).then(h=>{for(const p of [["    .nav-inner{max-width:920px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}\n","    .nav-inner{max-width:920px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}\n"],["","\n    .bracket-scroll{overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}\n    .bracket-grid{display:flex;gap:14px;align-items:flex-start;min-width:max-content}\n    .bracket-col{width:220px;flex:0 0 220px}\n    .bracket-col-title{font-size:12px;font-weight:1000;color:#93c5fd;text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px}\n    .bracket-match{position:relative;background:#10192c;border:1px solid #304262;border-radius:12px;padding:9px;margin:0 0 10px}\n    .bracket-match.live-match{border-color:var(--ku-blue);box-shadow:0 0 0 1px var(--ku-blue) inset}\n    .bracket-match.done-match{opacity:.62}\n    .bracket-slot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 8px;border-radius:8px;background:#17233a;margin-top:5px;min-height:34px}\n    .bracket-slot.winner{font-weight:900}\n    .bracket-seed{font-size:10px;color:#93c5fd;font-weight:900}\n    .bracket-status{font-size:10px;color:var(--muted);margin-top:7px;font-weight:800}\n    .nextup-card{border-left:4px solid var(--ku-blue)}\n    .waiting-card{border-left:4px solid var(--amber)}\n    .waiting-label{font-size:11px;font-weight:1000;color:#fde68a;text-transform:uppercase;letter-spacing:.5px}\n    .next-label{font-size:11px;font-weight:1000;color:#93c5fd;text-transform:uppercase;letter-spacing:.5px}\n"],["","    <button data-nav=\"bracket\"><span class=\"icon\">🏁</span>Bracket</button>\n"],["","    view===\"bracket\" ? bracketView() :\n"],["    <div><div class=\"brand\">Alpha Xi Bags Tourney</div><div class=\"subtle\">Tournament commissioner • V6 pre-GitHub</div></div>\n","    <div><div class=\"brand\">Alpha Xi Bags Tourney</div><div class=\"subtle\">Tournament commissioner • V7 bracket view</div></div>\n"],["  ${queued.length?`<div class=\"card\"><h2>Up Next</h2>${queued.slice(0,8).map(m=>queueLine(t,m)).join(\"\")}</div>`:\"\"}\n","  ${nextUpCard(t)}\n\n  ${queued.length?`<div class=\"card\"><h2>Ready Queue</h2>${queued.slice(0,8).map(m=>queueLine(t,m)).join(\"\")}</div>`:\"\"}\n"],["","}\n\nfunction sourceDescription(t,source){\n  if(!source) return \"TBD\";\n  if(source.kind===\"seed\"){\n    const tm=t.teams.find(x=>x.seed===source.seed);\n    return tm ? teamName(tm) : `Seed #${source.seed}`;\n  }\n  if(source.kind===\"team\"){\n    const tm=teamById(t,source.teamId);\n    return tm ? teamName(tm) : \"TBD\";\n  }\n  const ref=t.matches.find(x=>x.id===source.matchId);\n  if(!ref) return \"TBD\";\n  if(ref.status===\"completed\"){\n    const id=source.kind===\"winner\"?ref.winnerId:ref.loserId;\n    const tm=id?teamById(t,id):null;\n    return tm ? teamName(tm) : \"TBD\";\n  }\n  const resultWord=source.kind===\"winner\"?\"Winner\":\"Loser\";\n  if(ref.status===\"active\") return `${resultWord} of Board ${ref.board}`;\n  const label=ref.bracketLabel || (ref.bracket ? `${ref.bracket} R${ref.round}` : `Round ${ref.round}`);\n  return `${resultWord} of ${label}`;\n}\n\nfunction waitingMatchText(t,m){\n  if(m.type===\"loserSingle\") return `${pname(m.playerAId)} vs ${pname(m.playerBId)}`;\n  const a=m.teamAId ? teamName(teamById(t,m.teamAId)) : sourceDescription(t,m.sourceA);\n  const b=m.teamBId ? teamName(teamById(t,m.teamBId)) : sourceDescription(t,m.sourceB);\n  return `${a} vs ${b}`;\n}\n\nfunction nextUpCard(t){\n  const queued=t.matches.filter(m=>m.status===\"queued\");\n  const waiting=t.matches.filter(m=>m.status===\"waiting\");\n  if(!queued.length && !waiting.length) return \"\";\n\n  const ready=queued.slice(0,3).map(m=>`<div class=\"queue-item nextup-card\"><div class=\"next-label\">Ready when a board opens</div><strong>${esc(waitingMatchText(t,m))}</strong><div class=\"subtle\">${esc(m.bracketLabel || (m.type===\"loserTeam\"?\"Thunderdome\":m.type===\"loserSingle\"?\"Ultimate Loser\":`Round ${m.round}`))}</div></div>`).join(\"\");\n\n  const wait=waiting.slice(0,4).map(m=>{\n    const knownA=m.teamAId?teamName(teamById(t,m.teamAId)):sourceDescription(t,m.sourceA);\n    const knownB=m.teamBId?teamName(teamById(t,m.teamBId)):sourceDescription(t,m.sourceB);\n    return `<div class=\"queue-item waiting-card\"><div class=\"waiting-label\">Waiting on result</div><strong>${esc(knownA)}</strong><div class=\"subtle\">vs ${esc(knownB)}</div></div>`;\n  }).join(\"\");\n\n  return `<div class=\"card\"><div class=\"row between\"><h2>Next Up</h2><span class=\"pill\">${queued.length} ready • ${waiting.length} waiting</span></div>${ready}${wait}</div>`;\n}\n\nfunction bracketView(){\n  const t=current();\n  if(!t) return `<div class=\"card\"><h1>Bracket</h1><div class=\"empty\">Start a tournament to see the live bracket.</div><button class=\"btn primary full\" data-go=\"new\">Create Tournament</button></div>`;\n  return `<div class=\"card\"><div class=\"row between\"><div><h1>Bracket</h1><div class=\"subtle\">Live tournament path • display only</div></div><span class=\"pill\">${t.elimination===\"double\"?\"Double elimination\":\"Single elimination\"}</span></div></div>${visualBracket(t)}${nextUpCard(t)}`;\n}\n\nfunction visualBracket(t){\n  if(t.elimination===\"single\"){\n    const mains=t.matches.filter(m=>m.type===\"main\");\n    const rounds=[...new Set(mains.map(m=>m.round))].sort((a,b)=>a-b);\n    return `<div class=\"card\"><h2>Single-Elimination Bracket</h2><div class=\"bracket-scroll\"><div class=\"bracket-grid\">${rounds.map(r=>bracketColumn(t,`Round ${r}`,mains.filter(m=>m.round===r))).join(\"\")}</div></div></div>`;\n  }\n  const wb=t.matches.filter(m=>m.bracket===\"WB\");\n  const lb=t.matches.filter(m=>m.bracket===\"LB\");\n  const gf=t.matches.filter(m=>m.bracket===\"GF\");\n  const wbRounds=[...new Set(wb.map(m=>m.round))].sort((a,b)=>a-b);\n  const lbRounds=[...new Set(lb.map(m=>m.round))].sort((a,b)=>a-b);\n  return `<div class=\"card\"><div class=\"row between\"><h2>Winners Bracket</h2><span class=\"pill\">WB</span></div><div class=\"bracket-scroll\"><div class=\"bracket-grid\">${wbRounds.map(r=>bracketColumn(t,`WB Round ${r}`,wb.filter(m=>m.round===r))).join(\"\")}</div></div></div>\n  <div class=\"card\"><div class=\"row between\"><h2>Losers Bracket</h2><span class=\"pill red\">LB</span></div><div class=\"bracket-scroll\"><div class=\"bracket-grid\">${lbRounds.map(r=>bracketColumn(t,`LB Round ${r}`,lb.filter(m=>m.round===r))).join(\"\")}</div></div></div>\n  <div class=\"card\"><h2>Championship</h2><div class=\"bracket-scroll\"><div class=\"bracket-grid\">${bracketColumn(t,\"Grand Final\",gf)}</div></div></div>${loserSideBracket(t)}`;\n}\n\nfunction bracketColumn(t,title,matches){\n  return `<div class=\"bracket-col\"><div class=\"bracket-col-title\">${esc(title)}</div>${matches.map(m=>visualBracketMatch(t,m)).join(\"\") || `<div class=\"empty\">No games</div>`}</div>`;\n}\n\nfunction visualBracketMatch(t,m){\n  const teamLabel=id=>id&&teamById(t,id)?teamName(teamById(t,id)):null;\n  const a=teamLabel(m.teamAId) || sourceDescription(t,m.sourceA);\n  const b=teamLabel(m.teamBId) || sourceDescription(t,m.sourceB);\n  const cls=m.status===\"active\"?\" live-match\":m.status===\"completed\"?\" done-match\":\"\";\n  const winner=m.winnerId?teamLabel(m.winnerId):null;\n  const status=m.auto?\"Bye / auto-advance\":m.status===\"active\"?`Playing on Board ${m.board}`:m.status===\"queued\"?\"Ready to play\":m.status===\"completed\"?(winner?`Winner: ${winner}`:\"Complete\"):\"Waiting on prior result\";\n  return `<div class=\"bracket-match${cls}\"><div class=\"bracket-slot ${m.winnerId===m.teamAId?\"winner\":\"\"}\"><span>${esc(a||\"TBD\")}</span>${m.teamAId&&teamById(t,m.teamAId)?`<span class=\"bracket-seed\">#${teamById(t,m.teamAId).seed}</span>`:\"\"}</div><div class=\"bracket-slot ${m.winnerId===m.teamBId?\"winner\":\"\"}\"><span>${esc(b||\"TBD\")}</span>${m.teamBId&&teamById(t,m.teamBId)?`<span class=\"bracket-seed\">#${teamById(t,m.teamBId).seed}</span>`:\"\"}</div><div class=\"bracket-status\">${esc(status)}</div></div>`;\n}\n\nfunction loserSideBracket(t){\n  const td=t.matches.filter(m=>m.type===\"loserTeam\");\n  const ul=t.matches.filter(m=>m.type===\"loserSingle\");\n  if(!td.length&&!ul.length && (t.loserFormat===\"none\")) return \"\";\n  const cards=[];\n  td.forEach(m=>cards.push(`<div class=\"bracket-col\"><div class=\"bracket-col-title\">Thunderdome</div>${visualBracketMatch(t,m)}</div>`));\n  ul.forEach(m=>cards.push(`<div class=\"bracket-col\"><div class=\"bracket-col-title\">Ultimate Loser</div><div class=\"bracket-match ${m.status===\"active\"?\"live-match\":m.status===\"completed\"?\"done-match\":\"\"}\"><div class=\"bracket-slot\"><span>${esc(pname(m.playerAId))}</span></div><div class=\"bracket-slot\"><span>${esc(pname(m.playerBId))}</span></div><div class=\"bracket-status\">${esc(m.status===\"active\"?`Playing on Board ${m.board}`:m.status===\"queued\"?\"Ready to play\":m.status===\"completed\"?`Ultimate Loser: ${pname(m.loserId)}`:\"Waiting\")}</div></div></div>`));\n  if(!cards.length) return `<div class=\"card\"><h2>Thunderdome / Ultimate Loser</h2><div class=\"subtle\">The loser-side contest will appear here when its qualifying team(s) are known.</div></div>`;\n  return `<div class=\"card\"><h2>Thunderdome / Ultimate Loser</h2><div class=\"bracket-scroll\"><div class=\"bracket-grid\">${cards.join(\"\")}</div></div></div>`;\n"]]){if(!h.includes(p[0]))throw new Error('Patch mismatch');h=h.replace(p[0],p[1]);}document.open();document.write(h);document.close();}).catch(e=>document.body.innerHTML='<h2>V7 test failed to load</h2><pre>'+e+'</pre>');</script></body>
