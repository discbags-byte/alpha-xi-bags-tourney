<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alpha Xi Bags Tourney V7 Test</title><style>body{margin:0;background:#0b1020;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.top{position:sticky;top:0;z-index:3;background:#0b1020;border-bottom:1px solid #2a3856;padding:10px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs button{border:0;border-radius:12px;padding:12px;font-weight:900;color:white;background:#263653}.tabs button.active{background:#0051BA}.pane{display:none}.pane.active{display:block}.frame{width:100%;height:78vh;border:0;background:#0b1020}.wrap{padding:12px}.card{background:#151c2f;border:1px solid #2a3856;border-radius:16px;padding:14px;margin-bottom:12px}.row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}.pill{font-size:12px;font-weight:800;padding:6px 9px;border-radius:999px;background:#23314c}.scroll{overflow-x:auto}.grid{display:flex;gap:12px;min-width:max-content;align-items:flex-start}.col{width:220px;flex:0 0 220px}.ct{font-size:12px;font-weight:1000;color:#93c5fd;text-transform:uppercase;margin-bottom:7px}.match{background:#10192c;border:1px solid #304262;border-radius:12px;padding:8px;margin-bottom:10px}.match.live{border-color:#0051BA;box-shadow:0 0 0 1px #0051BA inset}.match.done{opacity:.65}.slot{padding:8px;background:#17233a;border-radius:8px;margin-top:5px;display:flex;justify-content:space-between;gap:8px}.status{font-size:11px;color:#9aa8bd;margin-top:7px}.next{border-left:4px solid #0051BA}.waiting{border-left:4px solid #f59e0b}.muted{color:#9aa8bd;font-size:13px}.empty{padding:20px;text-align:center;color:#9aa8bd}h2{margin:0 0 10px;font-size:19px}h3{margin:0 0 8px;font-size:16px}</style></head><body><div class="top"><div class="tabs"><button id="appTab" class="active">Live App</button><button id="bracketTab">Bracket Test</button></div></div><section id="appPane" class="pane active"><iframe class="frame" src="index.html"></iframe></section><section id="bracketPane" class="pane"><div class="wrap"><div class="card"><div class="row"><div><h2>Bracket Test</h2><div class="muted">Reads the same tournament data as the live app.</div></div><button id="refresh" style="border:0;border-radius:10px;padding:10px 12px;font-weight:900;background:#0051BA;color:#fff">Refresh</button></div></div><div id="bracket"></div></div></section><script>const KEY='alpha_xi_bags_tourney_v1';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function db(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}function team(t,id){return t?.teams?.find(x=>x.id===id)}function nameTeam(t,id){const tm=team(t,id);if(!tm)return null;const d=db();return tm.playerIds.map(pid=>d?.players?.find(p=>p.id===pid)?.name||'Unknown').join(' / ')}function refText(t,s){if(!s)return'TBD';if(s.kind==='seed'){const tm=t.teams.find(x=>x.seed===s.seed);return tm?nameTeam(t,tm.id):`Seed #${s.seed}`}if(s.kind==='team')return nameTeam(t,s.teamId)||'TBD';const m=t.matches.find(x=>x.id===s.matchId);if(!m)return'TBD';if(m.status==='completed'){const id=s.kind==='winner'?m.winnerId:m.loserId;return nameTeam(t,id)||'TBD'}const w=s.kind==='winner'?'Winner':'Loser';if(m.status==='active')return`${w} of Board ${m.board}`;return`${w} of ${m.bracketLabel||(m.bracket?`${m.bracket} R${m.round}`:`Round ${m.round}`)}`}function mhtml(t,m){const a=nameTeam(t,m.teamAId)||refText(t,m.sourceA),b=nameTeam(t,m.teamBId)||refText(t,m.sourceB);const cls=m.status==='active'?' live':m.status==='completed'?' done':'';let st=m.auto?'Bye / auto-advance':m.status==='active'?`Playing on Board ${m.board}`:m.status==='queued'?'Ready to play':m.status==='completed'?'Complete':'Waiting on prior result';return`<div class="match${cls}"><div class="slot"><span>${esc(a)}</span></div><div class="slot"><span>${esc(b)}</span></div><div class="status">${esc(st)}</div></div>`}function col(t,title,arr){return`<div class="col"><div class="ct">${esc(title)}</div>${arr.map(m=>mhtml(t,m)).join('')||'<div class="empty">No games</div>'}</div>`}function render(){const d=db(),t=d?.current;if(!t){$('#bracket').innerHTML='<div class="card empty">Start or resume a tournament in the Live App tab, then come back here.</div>';return}const main=t.matches||[];let html='';if(t.elimination==='double'){const wb=main.filter(m=>m.bracket==='WB'),lb=main.filter(m=>m.bracket==='LB'),gf=main.filter(m=>m.bracket==='GF');const wr=[...new Set(wb.map(m=>m.round))].sort((a,b)=>a-b),lr=[...new Set(lb.map(m=>m.round))].sort((a,b)=>a-b);html+=`<div class="card"><div class="row"><h2>Winners Bracket</h2><span class="pill">WB</span></div><div class="scroll"><div class="grid">${wr.map(r=>col(t,`WB Round ${r}`,wb.filter(m=>m.round===r))).join('')}</div></div></div>`;html+=`<div class="card"><div class="row"><h2>Losers Bracket</h2><span class="pill">LB</span></div><div class="scroll"><div class="grid">${lr.map(r=>col(t,`LB Round ${r}`,lb.filter(m=>m.round===r))).join('')}</div></div></div>`;html+=`<div class="card"><h2>Championship</h2><div class="scroll"><div class="grid">${col(t,'Grand Final',gf)}</div></div></div>`}else{const ms=main.filter(m=>m.type==='main'),rs=[...new Set(ms.map(m=>m.round))].sort((a,b)=>a-b);html+=`<div class="card"><h2>Single-Elimination Bracket</h2><div class="scroll"><div class="grid">${rs.map(r=>col(t,`Round ${r}`,ms.filter(m=>m.round===r))).join('')}</div></div></div>`}const queued=main.filter(m=>m.status==='queued'),waiting=main.filter(m=>m.status==='waiting');if(queued.length||waiting.length){html+=`<div class="card"><div class="row"><h2>Next Up</h2><span class="pill">${queued.length} ready • ${waiting.length} waiting</span></div>${queued.slice(0,4).map(m=>`<div class="match next"><div class="status">READY WHEN A BOARD OPENS</div><strong>${esc(nameTeam(t,m.teamAId)||refText(t,m.sourceA))}</strong><div class="muted">vs ${esc(nameTeam(t,m.teamBId)||refText(t,m.sourceB))}</div></div>`).join('')}${waiting.slice(0,6).map(m=>`<div class="match waiting"><div class="status">WAITING ON RESULT</div><strong>${esc(nameTeam(t,m.teamAId)||refText(t,m.sourceA))}</strong><div class="muted">vs ${esc(nameTeam(t,m.teamBId)||refText(t,m.sourceB))}</div></div>`).join('')}</div>`}const td=main.filter(m=>m.type==='loserTeam'),ul=main.filter(m=>m.type==='loserSingle');if(td.length||ul.length){html+='<div class="card"><h2>Thunderdome / Ultimate Loser</h2>';td.forEach(m=>html+=mhtml(t,m));ul.forEach(m=>{const p=id=>d.players.find(x=>x.id===id)?.name||'Unknown';html+=`<div class="match ${m.status==='active'?'live':m.status==='completed'?'done':''}"><div class="slot">${esc(p(m.playerAId))}</div><div class="slot">${esc(p(m.playerBId))}</div><div class="status">${m.status==='active'?`Playing on Board ${m.board}`:m.status==='completed'?`Ultimate Loser: ${esc(p(m.loserId))}`:'Ready / waiting'}</div></div>`});html+='</div>'}$('#bracket').innerHTML=html}function show(which){$('#appPane').classList.toggle('active',which==='app');$('#bracketPane').classList.toggle('active',which==='bracket');$('#appTab').classList.toggle('active',which==='app');$('#bracketTab').classList.toggle('active',which==='bracket');if(which==='bracket')render()}$('#appTab').onclick=()=>show('app');$('#bracketTab').onclick=()=>show('bracket');$('#refresh').onclick=render;</script></body></html>
